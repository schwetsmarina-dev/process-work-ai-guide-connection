name: Wire body state machine
on:
  push:
    paths:
      - '.github/workflows/wire-body-state-machine.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sessionAI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/sessionAI.js')
          s=p.read_text()
          imp='import { detectBodyProcessStage, buildBodyStageInstruction } from "@/lib/bodyProcess";\n'
          anchor='import { SYSTEM_PROMPT } from "@/lib/systemPrompt";\n'
          if imp not in s:
              assert anchor in s
              s=s.replace(anchor, anchor+imp, 1)

          # Body uses its own Mindell-specific u -> X -> U state machine, not generic primary/secondary mapping.
          anchor='''export function detectProcessMappingStage(messages, modeId) {\n  const modeKey = getModeKey(modeId);\n  if (!modeKey) return { stage: "complete", primary_answer: null, secondary_answer: null, dream_shared: true };\n'''
          repl='''export function detectProcessMappingStage(messages, modeId) {\n  const modeKey = getModeKey(modeId);\n  if (!modeKey) return { stage: "complete", primary_answer: null, secondary_answer: null, dream_shared: true };\n\n  // BODY IS STRUCTURALLY DIFFERENT: small u (primary) -> X -> big U (secondary).\n  // Never run body through the generic familiar-vs-unfamiliar primary/secondary questionnaire.\n  if (modeKey === "body") return detectBodyProcessStage(messages);\n'''
          assert anchor in s
          s=s.replace(anchor,repl,1)

          # Remove obsolete body generic questions/markers as a second line of defence.
          s=s.replace('  body:       ["как ты обычно объясняешь", "понятно, знакомо", "связано с твоей обычной жизнью"],','  body:       [],')
          s=s.replace('  body:       ["странное, необычное", "неожиданное", "не совсем твоё"],','  body:       [],')
          s=s.replace('    body:       "Как ты обычно объясняешь это ощущение? Что в нём для тебя понятно, знакомо или связано с твоей обычной жизнью?",','    body:       "",')
          s=s.replace('    body:       "А что в этом телесном ощущении странное, необычное, непонятное, неожиданное или как будто не совсем твоё?",','    body:       "",')

          # Dedicated BODY prompt must take precedence over generic map-status/mismatch/primary-secondary instructions.
          anchor='''  let mappingStageInstruction = "";\n\n  if (isDreamAlreadyTold) {'''
          repl='''  let mappingStageInstruction = "";\n\n  if (modeKey === "body" && !mappingStageComplete) {\n    mappingStageInstruction = buildBodyStageInstruction(mappingStage, language);\n  }\n  else if (isDreamAlreadyTold) {'''
          assert anchor in s
          s=s.replace(anchor,repl,1)

          # Generic forward forcing must not override the dedicated BODY state machine.
          anchor='''  const forcedNext = isIntegrationStage\n    ? null\n    : needsMapping\n    ? null\n    : getForcedNextLayer(currentMode, coveredLayers, mappingStage);'''
          repl='''  const forcedNext = modeKeyEarly === "body"\n    ? null\n    : isIntegrationStage\n    ? null\n    : needsMapping\n    ? null\n    : getForcedNextLayer(currentMode, coveredLayers, mappingStage);'''
          assert anchor in s
          s=s.replace(anchor,repl,1)

          p.write_text(s)
          PY
      - name: Validate syntax-sensitive invariants
        run: |
          grep -q 'detectBodyProcessStage(messages)' src/lib/sessionAI.js
          grep -q 'buildBodyStageInstruction(mappingStage, language)' src/lib/sessionAI.js
          grep -q 'BODY IS STRUCTURALLY DIFFERENT' src/lib/sessionAI.js
          ! grep -q 'Как ты обычно объясняешь это ощущение' src/lib/sessionAI.js
      - name: Commit
        run: |
          git config user.name 'talvira-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/sessionAI.js
          git diff --cached --quiet && exit 0
          git commit -m 'Use dedicated Mindell body state machine'
          git push
