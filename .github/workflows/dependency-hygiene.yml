name: Dependency hygiene

on:
  push:
    paths:
      - ".github/workflows/dependency-hygiene.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply npm security fixes
        run: npm audit fix

      - name: Refresh Browserslist database
        run: npx update-browserslist-db@latest

      - name: Verify dependency tree
        run: npm audit --audit-level=high

      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Fix dependency vulnerabilities and refresh browser data"
          git pull --rebase origin main
          git push origin HEAD:main
