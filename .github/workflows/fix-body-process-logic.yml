name: Fix body process logic
on:
  push:
    paths:
      - '.github/workflows/fix-body-process-logic.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Patch body-mode logic
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/sessionAI.js')
          s = p.read_text()

          replacements = [
            (
'''  body:       ["как ты обычно объясняешь", "понятно, знакомо", "связано с твоей обычной жизнью"],''',
'''  body:       ["где именно", "где в теле", "ощущается сильнее всего", "локализуется"],'''
            ),
            (
'''  body:       ["странное, необычное", "неожиданное", "не совсем твоё"],''',
'''  body:       ["какое оно по качеству", "как именно ощущается", "на что похоже изнутри", "каким ощущается"],'''
            ),
            (
'''    body: {
    process_mapping: "localization",
    localization:    "quality",
    emotion:         "movement",
    quality:         "movement",
    movement:        "image",
    image:           "immersion",
    immersion:       "message",
    message:         "life_connection",
  },''',
'''  body: {
    process_mapping: "localization",
    localization:    "quality",
    quality:         "image",
    image:           "immersion",
    immersion:       "movement",
    movement:        "message",
    message:         "life_connection",
  },'''
            ),
            (
'''  movement:         ["хочет двигаться", "хочет выйти", "тянет", "толкает", "сжимается", "расширяется", "поднимается", "опускается", "вырваться", "убежать", "остаться", "двигаться", "движение"],''',
'''  movement:         ["хочется двигаться", "я двигаюсь", "мне хочется двигаться", "хочу двигаться", "хочу дышать", "дышу", "хочется дышать", "хочется замереть", "хочется сжаться", "хочется распрямиться", "двигаюсь как", "движение"],'''
            ),
            (
'''  immersion:        ["что начинает происходить", "остаюсь рядом", "меняется состояние", "становится сильнее", "разворачивается внутри", "переживаю это", "не отталкиваю", "погружаюсь", "остаюсь с этим", "замечаю изменения", "продолжает меняться", "нахожусь внутри", "интенсивнее", "усиливается", "нарастает"],''',
'''  immersion:        ["что начинает происходить", "остаюсь рядом", "меняется состояние", "становится сильнее", "разворачивается внутри", "переживаю это", "не отталкиваю", "погружаюсь", "остаюсь с этим", "замечаю изменения", "продолжает меняться", "нахожусь внутри", "интенсивнее", "усиливается", "нарастает", "становлюсь этой", "становлюсь этим", "я эта плита", "я этот образ", "я это ощущение", "вхожу в образ", "становлюсь плитой"],'''
            ),
            (
'''    body:       "Как ты обычно объясняешь это ощущение? Что в нём для тебя понятно, знакомо или связано с твоей обычной жизнью?",''',
'''    body:       "Где именно в теле это ощущается сильнее всего? Просто опиши место и само ощущение — без объяснения причин.",'''
            ),
            (
'''    body:       "А что в этом телесном ощущении странное, необычное, непонятное, неожиданное или как будто не совсем твоё?",''',
'''    body:       "Как именно это ощущается изнутри? Опиши качество самого ощущения — давление, сжатие, тяжесть, пульсацию, форму, образ или что-то другое, что приходит само.",'''
            ),
            (
'''  movement:
    "Следующий слой — ДВИЖЕНИЕ / ИМПУЛЬС. Если пользователь уже дал образ (например «каменная плита»), НЕ приписывай движение самому объекту и НЕ спрашивай, куда хочет двигаться плита/камень/образ. Сначала предложи пользователю почувствовать себя этим образом/ощущением. Затем спроси нейтрально: если ТЫ становишься этим ощущением/образом, появляется ли у ТЕБЯ импульс двигаться, дышать, звучать или оставаться неподвижно? Движется пользователь в роли процесса, а не внешний объект.",''',
'''  movement:
    "Следующий слой — ДВИЖЕНИЕ / ИМПУЛЬС КЛИЕНТА. Движется НЕ образ и НЕ объект. Если уже появился образ (например «каменная плита»), работай через идентификацию: пользователь становится этим образом/ощущением. Затем спроси только о ЕГО собственном телесном импульсе из этой позиции: «Если ты сейчас эта плита — как тебе хочется двигаться или не двигаться? Как хочется дышать, звучать, занимать пространство?» Не приписывай плите намерение, желание или движение. Возможна неподвижность — это полноценный ответ.",'''
            ),
            (
'''  image:
    "Следующий слой — ОБРАЗ. Спроси: если бы это стало образом или существом — на что бы это было похоже?",''',
'''  image:
    "Следующий слой — ОБРАЗ. Если пользователь УЖЕ сам дал образ («как каменная плита», «как шар», «как туман»), НЕ спрашивай новый образ и не заменяй его. Сразу переходи к идентификации: «Попробуй на мгновение стать этой плитой / этим образом. Если ты — это, что ты замечаешь изнутри?» Только если образа ещё нет, спроси мягко: «Если позволить этому ощущению самому стать образом — что приходит?»",'''
            ),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected snippet in sessionAI.js:\n{old[:180]}')
            s = s.replace(old, new, 1)

          # Insert a body-specific runtime override before generic mapping instruction.
          anchor = '''  let mappingStageInstruction = "";\n\n  if (isDreamAlreadyTold) {'''
          insert = '''  let mappingStageInstruction = "";\n\n  // BODY MODE OVERRIDE: body work starts in direct sensory experience, not causal explanation.\n  // Internal stage names remain primary/secondary for compatibility, but their USER-FACING\n  // function in body mode is localization -> sensory quality. Life explanation belongs only\n  // after the experience has unfolded, never at the start.\n  const bodySensoryOnlyEarly = modeKey === "body" && !mappingStageComplete && !isIntegrationStage;\n\n  if (bodySensoryOnlyEarly && mappingStage.stage === "awaiting_primary") {\n    mappingStageInstruction = `\\n\\n🔴 BODY MODE — ЛОКАЛИЗАЦИЯ, БЕЗ ОБЪЯСНЕНИЙ\\n` +\n      `Задай ТОЛЬКО сенсорный вопрос: «${PRIMARY_QUESTIONS.body}»\\n` +\n      `ЗАПРЕЩЕНО спрашивать: почему это возникло, чем пользователь это объясняет, с чем это связано в жизни, что это означает.\\n` +\n      `ЗАПРЕЩЕНО подтверждать или опровергать медицинские причины. Если пользователь сам упомянул диагноз, давление, лекарства и т.п. — не развивай медицинскую гипотезу; возвращай внимание к непосредственному ощущению.`;\n  } else if (bodySensoryOnlyEarly && mappingStage.stage === "awaiting_secondary") {\n    mappingStageInstruction = `\\n\\n🔴 BODY MODE — КАЧЕСТВО ОЩУЩЕНИЯ, БЕЗ КОГНИТИВНОЙ ПРИЧИННОСТИ\\n` +\n      `Задай ТОЛЬКО: «${SECONDARY_QUESTIONS.body}»\\n` +\n      `Работай с ощущением, качеством, формой и спонтанным образом. НЕ спрашивай объяснение, причину или жизненную связь.`;\n  } else if (isDreamAlreadyTold) {'''
          if anchor not in s:
            raise SystemExit('Missing mappingStageInstruction anchor')
          s = s.replace(anchor, insert, 1)

          p.write_text(s)

          p2 = Path('src/lib/systemPrompt.js')
          t = p2.read_text()
          old = '''ДЛЯ РЕЖИМА ТЕЛО:\n  Стадия 1 — awaiting_body_signal: сначала спроси, какое телесное ощущение, симптом или сигнал человек хочет исследовать.\n  Стадия 2 — первичный процесс: только после описания телесного материала.\n  Стадия 3 — вторичный процесс: только после ответа на первичный.\n  Стадия 4 — исследование.'''
          new = '''ДЛЯ РЕЖИМА ТЕЛО:\n  Стадия 1 — awaiting_body_signal: сначала спроси, какое телесное ощущение, симптом или сигнал человек хочет исследовать.\n  Стадия 2 — локализация: где именно это ощущается. НЕ спрашивай, почему это возникло и чем человек это объясняет.\n  Стадия 3 — качество: как именно ощущается изнутри; давление, сжатие, тяжесть, пульсация, форма или спонтанный образ.\n  Стадия 4 — образ/идентификация: если образ уже появился сам, НЕ проси придумать новый. Предложи на мгновение стать этим образом/ощущением и исследовать его изнутри.\n  Стадия 5 — движение/дыхание/голос КЛИЕНТА из этой идентификации. Не заставляй двигаться объект: если образ — плита, движется или остаётся неподвижным человек, ставший плитой; плите не приписывается собственное желание двигаться.\n  Стадия 6 — голос/послание уже развёрнутого ощущения или образа.\n  Стадия 7 — связь с жизнью / интеграция только ПОСЛЕ достаточного сенсорного развёртывания.\n\nКРИТИЧЕСКОЕ ПРАВИЛО BODY MODE:\n• В начале и середине телесного исследования НЕ иди «в голову»: не спрашивай «как ты это объясняешь?», «с чем это связано?», «почему это происходит?».\n• Если пользователь сам говорит о диагнозе, давлении, лекарствах или предполагаемой причине, не подтверждай и не опровергай медицинскую причинность. Зафиксируй это как его контекст и вернись к непосредственному ощущению.\n• «У меня нет версии причины» — это НЕ материал для дальнейшего анализа причин. Просто возвращайся к ощущению.\n• Если пользователь уже дал образ («как каменная плита»), образ считается найденным. Следующий ход — стать этим образом; затем исследовать собственное движение, дыхание или голос из этой позиции.'''
          if old not in t:
            raise SystemExit('Missing BODY MODE systemPrompt block')
          t = t.replace(old, new, 1)
          p2.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/sessionAI.js src/lib/systemPrompt.js
          git commit -m "Correct body-mode sensory and embodiment flow"
          git push
