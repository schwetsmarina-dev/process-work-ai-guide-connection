name: Fix body process logic
on:
  push:
    paths: ['.github/workflows/fix-body-process-logic.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/sessionAI.js'); s=p.read_text()
          pairs=[
          ('  body:       ["как ты обычно объясняешь", "понятно, знакомо", "связано с твоей обычной жизнью"],','  body:       ["где именно", "где в теле", "ощущается сильнее всего", "локализуется"],'),
          ('  body:       ["странное, необычное", "неожиданное", "не совсем твоё"],','  body:       ["какое оно по качеству", "как именно ощущается", "на что похоже изнутри", "каким ощущается"],'),
          ('''  body: {\n    process_mapping: "localization",\n    localization:    "quality",\n    emotion:         "movement",\n    quality:         "movement",\n    movement:        "image",\n    image:           "immersion",\n    immersion:       "message",\n    message:         "life_connection",\n  },''','''  body: {\n    process_mapping: "localization",\n    localization:    "quality",\n    quality:         "image",\n    image:           "immersion",\n    immersion:       "movement",\n    movement:        "message",\n    message:         "life_connection",\n  },'''),
          ('    body:       "Как ты обычно объясняешь это ощущение? Что в нём для тебя понятно, знакомо или связано с твоей обычной жизнью?",','    body:       "Где именно в теле это ощущается сильнее всего? Просто опиши место и само ощущение — без объяснения причин.",'),
          ('    body:       "А что в этом телесном ощущении странное, необычное, непонятное, неожиданное или как будто не совсем твоё?",','    body:       "Как именно это ощущается изнутри? Опиши качество самого ощущения — давление, сжатие, тяжесть, пульсацию, форму, образ или что-то другое, что приходит само.",'),
          ('  movement:\n    "Следующий слой — ДВИЖЕНИЕ / ИМПУЛЬС. Спроси: что это ощущение хочет сделать? Куда оно движется?",','  movement:\n    "Следующий слой — ДВИЖЕНИЕ / ИМПУЛЬС КЛИЕНТА. Движется НЕ образ и НЕ объект. Если появился образ (например «каменная плита»), пользователь сначала становится этим образом/ощущением. Затем спроси о ЕГО телесном импульсе из этой позиции: «Если ты сейчас эта плита — как тебе хочется двигаться или не двигаться? Как хочется дышать, звучать, занимать пространство?» Не приписывай плите намерение или желание. Неподвижность — полноценный ответ.",'),
          ('  image:\n    "Следующий слой — ОБРАЗ. Спроси: если бы это стало образом или существом — на что бы это было похоже?",','  image:\n    "Следующий слой — ОБРАЗ. Если пользователь УЖЕ сам дал образ («как каменная плита», «как шар», «как туман»), образ найден: НЕ спрашивай новый. Следующий ход — идентификация: «Попробуй на мгновение стать этой плитой / этим образом. Если ты — это, что ты замечаешь изнутри?» Только если образа ещё нет, спроси, какой образ приходит сам.",')]
          for a,b in pairs:
              if a not in s: raise SystemExit('missing: '+a[:120])
              s=s.replace(a,b,1)
          old='  immersion:        ["что начинает происходить", "остаюсь рядом", "меняется состояние", "становится сильнее", "разворачивается внутри", "переживаю это", "не отталкиваю", "погружаюсь", "остаюсь с этим", "замечаю изменения", "продолжает меняться", "нахожусь внутри", "интенсивнее", "усиливается", "нарастает"],'
          if old in s: s=s.replace(old,'  immersion:        ["что начинает происходить", "остаюсь рядом", "меняется состояние", "становится сильнее", "разворачивается внутри", "переживаю это", "не отталкиваю", "погружаюсь", "остаюсь с этим", "замечаю изменения", "продолжает меняться", "нахожусь внутри", "интенсивнее", "усиливается", "нарастает", "становлюсь этой", "становлюсь этим", "я эта плита", "я этот образ", "я это ощущение", "вхожу в образ", "становлюсь плитой"],',1)
          anchor='  let mappingStageInstruction = "";\n\n  if (isDreamAlreadyTold) {'
          insert='''  let mappingStageInstruction = "";\n\n  const bodySensoryOnlyEarly = modeKey === "body" && !mappingStageComplete && !isIntegrationStage;\n  if (bodySensoryOnlyEarly && mappingStage.stage === "awaiting_primary") {\n    mappingStageInstruction = `\\n\\n🔴 BODY MODE — ЛОКАЛИЗАЦИЯ, БЕЗ ОБЪЯСНЕНИЙ\\n` + `Задай ТОЛЬКО: «${PRIMARY_QUESTIONS.body}»\\n` + `Не спрашивай почему, чем это объясняется, с чем связано в жизни или что означает. Не подтверждай и не опровергай медицинские причины.`;\n  } else if (bodySensoryOnlyEarly && mappingStage.stage === "awaiting_secondary") {\n    mappingStageInstruction = `\\n\\n🔴 BODY MODE — КАЧЕСТВО ОЩУЩЕНИЯ\\n` + `Задай ТОЛЬКО: «${SECONDARY_QUESTIONS.body}»\\n` + `Работай только с непосредственным ощущением, качеством, формой и спонтанным образом. Без причин и жизненных объяснений.`;\n  } else if (isDreamAlreadyTold) {'''
          if anchor not in s: raise SystemExit('missing override anchor')
          s=s.replace(anchor,insert,1); p.write_text(s)

          q=Path('src/lib/systemPrompt.js'); t=q.read_text()
          old='''ДЛЯ РЕЖИМА ТЕЛО:\n  Стадия 1 — awaiting_body_signal: сначала спроси, какое телесное ощущение, симптом или сигнал человек хочет исследовать.\n  Стадия 2 — первичный процесс: только после описания телесного материала.\n  Стадия 3 — вторичный процесс: только после ответа на первичный.\n  Стадия 4 — исследование.'''
          new='''ДЛЯ РЕЖИМА ТЕЛО:\n  Стадия 1 — телесный сигнал.\n  Стадия 2 — локализация: где именно ощущается. НИКАКИХ вопросов о причине или объяснении.\n  Стадия 3 — качество: как ощущается изнутри; допускай спонтанный образ.\n  Стадия 4 — если образ возник, предложи СТАТЬ этим образом/ощущением. Не проси новый образ.\n  Стадия 5 — движение/дыхание/голос КЛИЕНТА из идентификации. Не заставляй двигаться объект.\n  Стадия 6 — голос/послание развёрнутого ощущения/образа.\n  Стадия 7 — интеграция с жизнью только после сенсорного развёртывания.\n\nBODY MODE — ВЫСШИЙ ПРИОРИТЕТ:\n• Не спрашивай «как ты это объясняешь?», «почему?», «с чем связано?» до интеграции.\n• Упоминание диагноза, давления или лекарств — контекст пользователя, а не повод строить/подтверждать медицинскую гипотезу. Возвращайся к ощущению.\n• «У меня нет версии причины» не требует анализа причин.\n• Если пользователь сказал «как каменная плита», образ уже найден. Следующий ход — стать плитой; затем исследовать, как КЛИЕНТУ хочется двигаться/не двигаться, дышать или звучать из этой позиции.'''
          if old not in t: raise SystemExit('missing system body block')
          q.write_text(t.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/sessionAI.js src/lib/systemPrompt.js
          git commit -m 'Correct body sensory and embodiment flow'
          git push
