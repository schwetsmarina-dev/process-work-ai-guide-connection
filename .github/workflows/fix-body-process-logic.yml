name: Fix body process logic
on:
  push:
    paths: ['.github/workflows/fix-body-process-logic.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch body process state machine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/sessionAI.js')
          s = p.read_text()

          # 1) Body primary/secondary markers: primary is lived pattern, not causal explanation.
          s = s.replace(
            '  body:       ["как ты обычно объясняешь", "понятно, знакомо", "связано с твоей обычной жизнью"],',
            '  body:       ["как этот симптом обычно проживается", "что происходит с тобой, когда", "как часто это случается", "когда это обычно начинается", "после каких ситуаций"],'
          )
          s = s.replace(
            '  body:       ["странное, необычное", "неожиданное", "не совсем твоё"],',
            '  body:       ["наименее привычным", "не твоим обычным способом", "что здесь неожиданно", "что в этом переживании новое"],'
          )

          # 2) Add explicit body-primary profile detector before INITIAL_MATERIAL_STAGE.
          anchor = '''const INITIAL_MATERIAL_STAGE = {\n  body: "awaiting_body_signal",'''
          helper = r'''const BODY_PRIMARY_DIMENSIONS = {
  localization: ["в голове", "в груди", "в животе", "в спине", "в шее", "в плеч", "в руках", "в ногах", "в глаз", "в виск", "в лбу", "в макуш", "слева", "справа", "где именно"],
  quality: ["давлен", "сжати", "тяжест", "пульсац", "жжен", "жжёт", "остр", "туп", "ноющ", "каменн", "плита", "как будто", "похоже на"],
  impact: ["хочется лечь", "хочу лечь", "лежать", "закрываются глаза", "закрыть глаза", "глушит", "ослепляет", "яркий свет", "не нравится шум", "мешает шум", "не могу", "хочется тишины", "тошнит", "тошнота"],
  temporal: ["давно", "часто", "редко", "иногда", "каждый", "раз в", "началось", "начинается", "случается", "обычно", "утром", "вечером", "ночью", "час", "день"],
  context: ["после", "когда", "если", "недосып", "не высп", "сон", "работ", "нагруз", "стресс", "бег", "спорт", "трениров", "еда", "цикл", "дорог", "экран"],
};

function detectBodyPrimaryProfile(messages) {
  const userMessages = messages.filter((m) => m.role === "user");
  const combined = userMessages.map((m) => m.content.toLowerCase()).join(" ");
  const dimensions = Object.entries(BODY_PRIMARY_DIMENSIONS)
    .filter(([, signals]) => signals.some((sig) => combined.includes(sig)))
    .map(([name]) => name);
  const hasLifePattern = dimensions.some((d) => d === "impact" || d === "temporal" || d === "context");
  const sufficient = dimensions.length >= 3 && hasLifePattern;
  const summary = userMessages.slice(-6).map((m) => m.content.trim()).filter(Boolean).join(" | ").slice(0, 700);
  return { dimensions, sufficient, summary };
}

function getBodyPrimaryNextQuestion(profile, language = "ru") {
  const has = new Set(profile?.dimensions || []);
  const es = language === "es";
  if (!has.has("localization")) return es
    ? "¿Dónde exactamente lo notas en el cuerpo? Señala la zona lo más concretamente posible."
    : "Где именно в теле это ощущается? Назови место как можно конкретнее.";
  if (!has.has("quality")) return es
    ? "¿Cómo se siente exactamente desde dentro: presión, peso, contracción, pulsación, forma, imagen u otra cualidad que aparezca sola?"
    : "Как именно это ощущается изнутри: давление, тяжесть, сжатие, пульсация, форма, образ или другое качество, которое приходит само?";
  if (!has.has("impact")) return es
    ? "Cuando aparece, ¿cómo lo vives normalmente? ¿Qué te apetece hacer o dejar de hacer; qué pasa con tus ojos, tu atención, el movimiento, la luz o los sonidos?"
    : "Когда это появляется, как ты обычно это проживаешь? Что тебе хочется делать или перестать делать; что происходит с глазами, вниманием, движением, светом, звуками?";
  if (!has.has("temporal")) return es
    ? "¿Desde cuándo te ocurre y con qué frecuencia suele aparecer?"
    : "Как давно это у тебя бывает и как часто обычно случается?";
  if (!has.has("context")) return es
    ? "Sin buscar una causa médica: ¿has notado en qué momentos o después de qué situaciones suele aparecer más a menudo?"
    : "Не пытаясь искать медицинскую причину: замечала ли ты, в какие моменты или после каких ситуаций это чаще появляется?";
  return es
    ? "¿Qué más forma parte de tu manera habitual de vivir este síntoma cuando aparece?"
    : "Что ещё входит в твой обычный способ проживать этот симптом, когда он появляется?";
}

const INITIAL_MATERIAL_STAGE = {
  body: "awaiting_body_signal",'''
          if anchor not in s:
            raise SystemExit('missing INITIAL_MATERIAL_STAGE anchor')
          s = s.replace(anchor, helper, 1)

          # 3) Build body-primary profile before generic question-marker state machine.
          old = '''  let primaryQuestionIndex = -1;\n  let secondaryQuestionIndex = -1;'''
          new = '''  const bodyPrimaryProfile = modeKey === "body" ? detectBodyPrimaryProfile(messages) : null;
  if (modeKey === "body" && bodyPrimaryProfile && !bodyPrimaryProfile.sufficient) {
    return {
      stage: "awaiting_body_primary",
      primary_answer: null,
      secondary_answer: null,
      dream_shared: true,
      body_primary_dimensions: bodyPrimaryProfile.dimensions,
      body_primary_summary: bodyPrimaryProfile.summary,
    };
  }

  let primaryQuestionIndex = -1;
  let secondaryQuestionIndex = -1;'''
          if old not in s:
            raise SystemExit('missing question-index anchor')
          s = s.replace(old, new, 1)

          # 4) When enough body-primary material exists, lock it as primary process.
          old = '''  let primary_answer = null;\n  let secondary_answer = null;'''
          new = '''  let primary_answer = modeKey === "body" && bodyPrimaryProfile?.sufficient
    ? bodyPrimaryProfile.summary
    : null;
  let secondary_answer = null;'''
          if old not in s:
            raise SystemExit('missing primary_answer declaration')
          s = s.replace(old, new, 1)

          # 5) Body questions: no causal-theory question; secondary only after rich primary profile.
          s = s.replace(
            '    body:       "Как ты обычно объясняешь это ощущение? Что в нём для тебя понятно, знакомо или связано с твоей обычной жизнью?",',
            '    body:       "Как этот симптом обычно проживается тобой в реальной жизни — что происходит с тобой, когда он появляется?",'
          )
          s = s.replace(
            '    body:       "А что в этом телесном ощущении странное, необычное, непонятное, неожиданное или как будто не совсем твоё?",',
            '    body:       "Если привычный рисунок этого симптома уже достаточно понятен: что в самом переживании кажется тебе наименее привычным для тебя, неожиданным или как будто не твоим обычным способом быть?",'
          )

          # 6) Body-specific runtime instruction for the new primary-profile stage.
          anchor = '''  let mappingStageInstruction = "";\n\n  if (isDreamAlreadyTold) {'''
          insert = '''  let mappingStageInstruction = "";

  if (modeKey === "body" && mappingStage.stage === "awaiting_body_primary") {
    const profile = detectBodyPrimaryProfile(messages);
    const nextBodyQuestion = getBodyPrimaryNextQuestion(profile, language);
    mappingStageInstruction = `\n\n🔴 BODY MODE — РАЗВЕРНУТЬ ПЕРВИЧНЫЙ ПРОЦЕСС ПЕРЕД ВТОРИЧНЫМ\n` +
      `Уже собранные измерения первичного процесса: ${profile.dimensions.join(", ") || "только исходный симптом"}.\n` +
      `Задай РОВНО ОДИН следующий вопрос: «${nextBodyQuestion}»\n` +
      `Цель — конкретно проявить, КАК человек обычно проживает симптом: локализация, качество, влияние на поведение/восприятие, временной рисунок, ситуационные совпадения.\n` +
      `НЕ переходи к вторичному процессу, образной амплификации, движению или посланию, пока первичный процесс не проявлен достаточно.\n` +
      `МЕДИЦИНСКАЯ ГРАНИЦА: не ставь диагнозы, не предполагай патофизиологические причины, не подтверждай и не опровергай медицинские версии и не давай медицинских рекомендаций.\n` +
      `Можно спрашивать только наблюдаемую последовательность: когда/как часто/после каких ситуаций человек сам замечает симптом. Не спрашивай «почему, как ты думаешь, это началось?».`;
  } else if (isDreamAlreadyTold) {'''
          if anchor not in s:
            raise SystemExit('missing mapping instruction anchor')
          s = s.replace(anchor, insert, 1)

          # 7) Body forward chain: primary profile first; image may arise inside primary, then embodiment.
          old = '''  body: {\n    process_mapping: "localization",\n    localization:    "quality",\n    emotion:         "movement",\n    quality:         "movement",\n    movement:        "image",\n    image:           "immersion",\n    immersion:       "message",\n    message:         "life_connection",\n  },'''
          new = '''  body: {
    process_mapping: "localization",
    localization:    "quality",
    quality:         "image",
    image:           "immersion",
    immersion:       "movement",
    movement:        "message",
    message:         "life_connection",
  },'''
          if old in s:
            s = s.replace(old, new, 1)

          # 8) Image and movement rules: identify with image; client moves/breathes/sounds, not the object.
          s = s.replace(
            '  image:\n    "Следующий слой — ОБРАЗ. Спроси: если бы это стало образом или существом — на что бы это было похоже?",',
            '  image:\n    "Следующий слой — ОБРАЗ. Если пользователь уже сам дал образ («как каменная плита», «как шар», «как туман»), образ УЖЕ найден — не проси другой. Предложи на мгновение СТАТЬ этим образом/ощущением и заметить, как это переживается изнутри. Только если образа нет, спроси, какой образ приходит сам.",'
          )
          s = s.replace(
            '  movement:\n    "Следующий слой — ДВИЖЕНИЕ / ИМПУЛЬС. Спроси: что это ощущение хочет сделать? Куда оно движется?",',
            '  movement:\n    "Следующий слой — ДВИЖЕНИЕ / ДЫХАНИЕ / ГОЛОС КЛИЕНТА ИЗ ИДЕНТИФИКАЦИИ. Движется не плита/образ как внешний объект. Пользователь становится образом и исследует СВОЙ импульс: как хочется двигаться или не двигаться, дышать, звучать, занимать пространство. Неподвижность — полноценный ответ. Если естественнее возникает голос, можно идти в голос вместо движения.",'
          )
          s = s.replace('"камень", "каменн", "плита",', '"камень", "каменн", "плита",')

          p.write_text(s)

          # 9) System prompt: explicit body-mode primary-process structure.
          q = Path('src/lib/systemPrompt.js')
          t = q.read_text()
          old = '''ДЛЯ РЕЖИМА ТЕЛО:\n  Стадия 1 — awaiting_body_signal: сначала спроси, какое телесное ощущение, симптом или сигнал человек хочет исследовать.\n  Стадия 2 — первичный процесс: только после описания телесного материала.\n  Стадия 3 — вторичный процесс: только после ответа на первичный.\n  Стадия 4 — исследование.'''
          new = '''ДЛЯ РЕЖИМА ТЕЛО:
  Стадия 1 — исходный телесный сигнал: что именно человек хочет исследовать.
  Стадия 2 — локализация: где именно ощущается.
  Стадия 3 — РАЗВЁРНУТЫЙ ПЕРВИЧНЫЙ ПРОЦЕСС. Не спеши во вторичный. Собери несколько аспектов того, КАК человек обычно проживает симптом:
    • сенсорное качество — давление, тяжесть, сжатие, пульсация, форма, спонтанный образ;
    • привычная реакция и поведение — хочется лечь, закрыть глаза, замереть, уйти в тишину и т.п.;
    • влияние на восприятие — свет, звук, внимание, движение и другие конкретные проявления;
    • временной рисунок — как давно, как часто, когда обычно появляется;
    • наблюдаемые ситуационные совпадения — после недосыпа, нагрузки, конкретных ситуаций и т.п., ТОЛЬКО если это замечает сам человек.
  Задавай по ОДНОМУ вопросу за раз и собери достаточно конкретный привычный рисунок симптома прежде, чем искать вторичный процесс.
  Стадия 4 — вторичный процесс: только после хорошо проявленного первичного процесса исследуй то, что в переживании менее привычно, неожиданно, не идентифицировано человеком или начинает возникать при амплификации.
  Стадия 5 — если возник образ, предложи стать этим образом/ощущением. Если образ уже дан («каменная плита»), не проси новый.
  Стадия 6 — из идентификации исследуй движение/неподвижность, дыхание, звук или голос САМОГО КЛИЕНТА. Не заставляй внешний объект двигаться.
  Стадия 7 — голос/послание и затем интеграция с жизнью, только после достаточного развёртывания.

КРИТИЧЕСКАЯ ГРАНИЦА BODY MODE:
• Не спрашивай «почему это началось?» и «как ты объясняешь причину?». Это уводит в когнитивную теорию вместо переживания.
• Разрешены вопросы наблюдения: «когда ты замечаешь начало?», «как часто?», «после каких ситуаций ты сама это замечала?», потому что они описывают ПАТТЕРН ПРОЖИВАНИЯ, а не медицинскую причинность.
• Не ставь диагнозы, не предполагай медицинские причины, не подтверждай и не опровергай диагнозы/патофизиологию и не давай медицинских рекомендаций в рамках процессуальной сессии.
• Упоминание лекарств, диагноза или давления — контекст пользователя; не превращай его в медицинский разбор и не пугай медицинскими гипотезами.'''
          if old not in t:
            raise SystemExit('missing BODY MODE system prompt block')
          q.write_text(t.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/sessionAI.js src/lib/systemPrompt.js
          git commit -m 'Model rich body primary process before secondary'
          git push
