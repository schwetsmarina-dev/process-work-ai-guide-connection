name: Temporary fix sessionAI unused import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix unused completion signal import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove unused COMPLETION_SIGNALS import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/sessionAI.js')
          s = p.read_text()
          old = 'import { COMPLETION_SIGNALS, detectCompletionState } from "@/lib/sessionSignals";'
          new = 'import { detectCompletionState } from "@/lib/sessionSignals";'
          if old not in s:
              raise SystemExit('Expected import not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/sessionAI.js
          git commit -m "Fix unused completion signal import"
          git push
