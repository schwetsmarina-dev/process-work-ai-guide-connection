name: Fix Dependabot alerts

on:
  push:
    paths:
      - '.github/workflows/fix-dependabot-alerts.yml'

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Update vulnerable dependencies
        run: |
          npm install vite@~6.4.2 vitest@~3.2.6 react-router-dom@~7.18.0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Commit verified dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix vulnerable npm dependencies"
          git push
