name: One-off continuation and body logic fix
on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-continuation-body.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch exact regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Continuation must NEVER append the canonical first question.
          p = Path('src/pages/SessionChat.jsx')
          s = p.read_text()
          old = '''  if (carryOverContext) {\n    const bridge = isEs\n      ? "Antes de continuar: la última vez, en esta misma dirección, llegamos a esto — ¿quieres profundizar justo ahí, o prefieres empezar por algo distinto?"\n      : "Прежде чем продолжим: в прошлый раз в этом же направлении мы пришли вот к чему — хочешь углубить именно это, или начать с чего-то другого?";\n    return `${bridge}\\n\\n${base}`;\n  }'''
          new = '''  if (carryOverContext) {\n    const compact = String(carryOverContext).replace(/\\s+/g, " ").trim().slice(0, 700);\n    return isEs\n      ? `Retomamos el proceso anterior, sin empezar de cero. Punto de continuidad: «${compact}».\\n\\n¿Qué de esto sigue más vivo o inacabado ahora mismo?`\n      : `Мы продолжаем предыдущую работу, не начиная заново. Точка продолжения: «${compact}».\\n\\nЧто из этого сейчас остаётся самым живым или незавершённым?`;\n  }'''
          assert old in s, 'SessionChat continuation block not found'
          s = s.replace(old, new, 1)
          old2 = '    content: `${t("greeting_start", language)}\\n\\n${fallbackOpening}`,'
          new2 = '    content: carryOverContext ? fallbackOpening : `${t("greeting_start", language)}\\n\\n${fallbackOpening}`,'
          assert old2 in s, 'fallback greeting line not found'
          s = s.replace(old2, new2, 1)
          old3 = '      const greeting = `${t("greeting_start", language)}\\n\\n${openingQuestion}`;'
          new3 = '      const greeting = session.carry_over_context ? openingQuestion : `${t("greeting_start", language)}\\n\\n${openingQuestion}`;'
          assert old3 in s, 'normal greeting line not found'
          s = s.replace(old3, new3, 1)
          p.write_text(s)

          # 2) Body mode: recognise image/metaphor stems and do not assume movement/agency.
          p = Path('src/lib/sessionAI.js')
          s = p.read_text()
          old = '    ["образ", "похоже на", "как будто", "напоминает", "представляю", "вижу", "картина", "существо", "животное", "цвет", "форма", "камень", "вода", "огонь", "свет"],'
          new = '    ["образ", "похоже на", "как будто", "напоминает", "представляю", "вижу", "картина", "существо", "животное", "цвет", "форма", "камень", "каменн", "плита", "вода", "огонь", "свет"],'
          assert old in s, 'image signal row not found'
          s = s.replace(old, new, 1)
          old = '  movement:\n    "Следующий слой — ДВИЖЕНИЕ / ИМПУЛЬС. Спроси: что это ощущение хочет сделать? Куда оно движется?",'
          new = '  movement:\n    "Следующий слой — ДВИЖЕНИЕ / ИМПУЛЬС. НЕ приписывай ощущению желание или движение. Спроси нейтрально: «Есть ли у этого ощущения какой-то импульс движения — или оно скорее остаётся неподвижным?» Если пользователь уже дал образ/метафору (например камень, плита, форма), НЕ заставляй переходить в движение: продолжай уже возникший образ.",'
          assert old in s, 'movement instruction not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Medical/causal epistemic safety in body work.
          p = Path('src/lib/systemPrompt.js')
          s = p.read_text()
          anchor = '• Это касается и голоса внутреннего критика — называй его просто «этот голос», а не «краевая фигура».\n'
          addition = '''\n▶ ПРАВИЛО 6 — В РЕЖИМЕ ТЕЛО НЕ ПОДТВЕРЖДАЙ МЕДИЦИНСКИЕ ВЫВОДЫ И НЕ ДОДУМЫВАЙ ПРИЧИННОСТЬ\n• Если пользователь говорит «это не мигрень», «давление исключено», «лекарство это исключает» и т.п. — НЕ подтверждай это как установленный факт. Ты не можешь определить медицинскую причину симптома.\n• Нельзя отражать: «ты исключаешь влияние давления» как будто это клинически подтверждено. Корректно: «ты связываешь это не с привычной мигренью; медицинскую причину мы здесь не определяем, поэтому останемся с тем, как ощущение переживается сейчас».\n• «У меня нет версии» означает только отсутствие версии. НЕ превращай это в вывод «значит, симптом ни с чем в жизни не связан» или «обычные объяснения не подходят».\n• Не предлагай причинную психологическую интерпретацию физического симптома. Исследуй феноменологию: место, качество, интенсивность, образ, спонтанный импульс — только из слов пользователя.\n• Если появляется новое/необычное или потенциально опасное физическое состояние, не убеждай человека, что оно психологическое, и не отговаривай от медицинской оценки.\n'''
          assert anchor in s, 'system prompt rule-5 anchor not found'
          s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-fix-continuation-body.yml
          git config user.name "schwetsmarina-dev"
          git config user.email "schwets.marina@gmail.com"
          git add src/pages/SessionChat.jsx src/lib/sessionAI.js src/lib/systemPrompt.js .github/workflows/oneoff-fix-continuation-body.yml
          git commit -m "Fix continuation reset and body-mode reasoning"
          git push