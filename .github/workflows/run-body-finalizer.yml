name: Run Body finalizer
on:
  push:
    paths:
      - '.github/workflows/run-body-finalizer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/finalize-body.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/bodyProcess.js src/lib/sessionAI.js
          git commit -m "Finalize dedicated Body process flow"
          git push
