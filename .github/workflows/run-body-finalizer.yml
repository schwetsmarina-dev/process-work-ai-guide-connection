name: Run Body finalizer
on:
  push:
    paths:
      - '.github/workflows/run-body-finalizer.yml'
      - 'scripts/finalize-body.mjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/finalize-body.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/sessionAI.js
          if git diff --cached --quiet; then
            echo "No Body wiring changes needed"
          else
            git commit -m "Load Body channels from Term table"
            git push
          fi
